<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL STUDIO UPLOAD ID</title>
<style>
:root{--bg:#14101c;--panel:#201a2e;--field:#2a2340;--text:#f1edf8;--muted:#9d93b5;--accent:#ff8a3d;--ok:#5fd38d;--err:#ff6b7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:16px 16px 40px}
main{max-width:480px;margin:0 auto}
h1{font-size:1.4rem;margin:8px 0 16px}
.tabs{display:flex;gap:6px;background:var(--panel);padding:6px;border-radius:16px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:12px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--field);color:var(--text)}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 14px}
label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--field);color:var(--text);border:1px solid transparent;border-radius:14px;padding:13px 14px;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{width:100%;margin-top:20px;border:0;border-radius:16px;background:var(--accent);color:#1a1008;font:700 1rem system-ui;padding:15px;cursor:pointer}
.go:disabled{opacity:.5}
#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:456px;margin:auto;background:#000;border-radius:24px;padding:18px;display:none;z-index:9}
#toast b{display:block}#toast.err b{color:var(--err)}#toast.ok b{color:var(--ok)}
#toast .a{display:flex;gap:8px;margin-top:12px}
#toast .a *{flex:1;border:0;border-radius:999px;padding:11px;font:600 .95rem system-ui;text-align:center;text-decoration:none;cursor:pointer}
#open{background:#fff;color:#000}#close{background:#2a2a2a;color:#fff}
</style>
</head>
<body>
<div id="toast"><b id="tt"></b><div id="tm"></div><div class="a"><a id="open" target="_blank" rel="noopener">Buka</a><button id="close">Tutup</button></div></div>
<main>
<h1>AL STUDIO UPLOAD ID</h1>
<div class="tabs" id="tabs">
  <button data-t="decal" class="on">Decal</button><button data-t="audio">Audio</button><button data-t="file">File</button>
</div>
<p class="hint" id="hint"></p>
<form id="f">
  <label>File</label><input type="file" id="file" required>
  <label>API key</label><input type="password" id="key" autocomplete="off" required>
  <div class="row">
    <div><label>Upload ke</label><select id="target"><option value="user">Akun</option><option value="group">Grup</option></select></div>
    <div><label id="ownerLbl">User ID</label><input id="owner" inputmode="numeric" required></div>
  </div>
  <label>Nama</label><input id="name" maxlength="50" required>
  <label>Deskripsi</label><textarea id="desc" rows="3" maxlength="1000"></textarea>
  <button class="go" id="go">Upload</button>
</form>
</main>
<script>
const H={decal:["Upload gambar PNG/JPG/BMP/TGA.",".png,.jpg,.jpeg,.bmp,.tga"],audio:["Upload audio MP3/OGG.",".mp3,.ogg"],file:["Upload model rbxm/rbxmx/fbx.",".rbxm,.rbxmx,.fbx"]};
let type="decal";
const $=id=>document.getElementById(id);
function setType(t){type=t;$("hint").textContent=H[t][0]+" Semua kolom wajib diisi.";$("file").accept=H[t][1];
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));}
$("tabs").onclick=e=>e.target.dataset.t&&setType(e.target.dataset.t);
$("target").onchange=()=>$("ownerLbl").textContent=$("target").value==="group"?"Group ID":"User ID";
$("file").onchange=()=>{const f=$("file").files[0];if(f&&!$("name").value)$("name").value=f.name.replace(/\.[^.]+$/,"")};
$("close").onclick=()=>$("toast").style.display="none";
function toast(ok,title,msg,url){const t=$("toast");t.className=ok?"ok":"err";t.style.display="block";
  $("tt").textContent=title;$("tm").textContent=msg;$("open").style.display=url?"":"none";if(url)$("open").href=url;}
$("key").value=localStorage.getItem("k")||"";
$("f").onsubmit=async e=>{e.preventDefault();$("go").disabled=true;$("go").textContent="Mengunggah…";
  const d=new FormData();d.append("type",type);d.append("file",$("file").files[0]);d.append("apiKey",$("key").value);
  d.append("target",$("target").value);d.append("ownerId",$("owner").value);d.append("name",$("name").value);d.append("description",$("desc").value);
  try{const r=await fetch("/api/upload",{method:"POST",body:d});const j=await r.json();
    if(j.ok){localStorage.setItem("k",$("key").value);toast(true,"Berhasil",`${j.name}\nID ${j.assetId}`,j.url);}
    else toast(false,"Gagal",j.error||"Terjadi kesalahan");
  }catch(err){toast(false,"Gagal","Tidak bisa terhubung ke server");}
  $("go").disabled=false;$("go").textContent="Upload";};
$("tm").style.whiteSpace="pre-line";setType("decal");
</script>
</body>
</html>
